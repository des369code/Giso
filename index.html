<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReelRecall — your saved reels, finally used</title>
<meta name="description" content="ReelRecall reads what you saved and hands you back one thing to do with it, once a day.">
<meta property="og:title" content="ReelRecall — your saved reels, finally used">
<meta property="og:description" content="ReelRecall reads what you saved and hands you back one thing to do with it, once a day.">
<meta property="og:type" content="website">
<meta property="og:image" content="og-card.png">
<meta name="theme-color" content="#7879F1">
<style>
  :root {
    /* DESIGN.md tokens — unchanged */
    --ink: #1C1C1E;
    --ink-2: #6E6E73;
    --ink-3: #7A7A80;
    --accent: #7879F1;
    --hairline: #E0E0E0;
    --success: #30D158;
    --radius-btn: 12px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
    background: #FFFFFF; color: var(--ink);
    -webkit-font-smoothing: antialiased; line-height: 1.5;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .center { width: 100%; max-width: 640px; text-align: center; padding: 24px 0; }

  h1 { font-size: clamp(30px, 6vw, 42px); font-weight: 700; letter-spacing: -1.2px; line-height: 1.12; margin: 0 auto 18px; max-width: 620px; }
  .sub { font-size: 17px; color: var(--ink-2); margin: 0 auto 32px; max-width: 460px; line-height: 1.55; }

  form { max-width: 360px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .field {
    font: inherit; font-size: 16px; color: var(--ink);
    padding: 13px 16px; border: 1px solid var(--hairline); border-radius: var(--radius-btn);
    background: #fff; text-align: center; width: 100%;
  }
  .field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(120,121,241,.15); }
  .btn {
    font: inherit; font-size: 16px; font-weight: 600; letter-spacing: -0.3px;
    background: var(--accent); color: #fff;
    padding: 13px; border: none; border-radius: var(--radius-btn); cursor: pointer; width: 100%;
    transition: background .15s;
  }
  .btn:hover { background: #6667E0; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .6; cursor: default; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .form-err { display: none; font-size: 13px; color: #C0392B; margin-top: 4px; }

  .form-ok { display: none; max-width: 360px; margin: 0 auto; }
  .form-ok .tick { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 14px; background: var(--success); color: #fff; font-size: 20px; font-weight: 700; margin-bottom: 14px; }
  .form-ok h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.4px; margin-bottom: 6px; }
  .form-ok p { font-size: 14px; color: var(--ink-2); }
  body.saved form { display: none; }
  body.saved .form-ok { display: block; }
</style>
</head>
<body>

<div class="center">
  <h1>Your saved reels have good ideas in them. None of them made it into your life.</h1>
  <p class="sub">ReelRecall reads what you saved and hands you back one thing to do with it, once a day.</p>

  <form id="wl">
    <input class="field" type="email" id="email" name="email" placeholder="your@email.com" required autocomplete="email" aria-label="Email address">
    <button class="btn" type="submit" id="join">Join the waitlist</button>
    <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="form-err" id="err"></div>
  </form>
  <div class="form-ok" aria-live="polite">
    <div class="tick">✓</div>
    <h2>You're on the list</h2>
    <p>Your first card will find you when we're ready.</p>
  </div>
</div>

<script>
  /* ---- waitlist form → Supabase ---- */
  const SUPABASE_URL = "https://mxfaywcdsopxtehcgxgp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_VIbwCBfUTyAtKaorXSoPDQ_5b0RBTX6";
  const form = document.getElementById("wl");
  const err = document.getElementById("err");
  const btn = document.getElementById("join");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.style.display = "none";
    const email = document.getElementById("email").value.trim().toLowerCase();
    const isBot = form.website.value !== "";
    if (!email || isBot) { document.body.classList.add("saved"); return; }
    btn.disabled = true; btn.textContent = "Saving…";
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/waitlist`, {
        method: "POST",
        headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", "Prefer": "return=minimal" },
        body: JSON.stringify({ email, source: "landing" })
      });
      if (res.status === 201 || res.status === 409) { document.body.classList.add("saved"); }
      else { throw new Error(); }
    } catch (ex) {
      err.textContent = "Something went wrong — please try again.";
      err.style.display = "block";
      btn.disabled = false; btn.textContent = "Join the waitlist";
    }
  });
</script>
</body>
</html>
