<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <text x="120" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-1" fill="#7879F1">Sift</text>
  <text x="120" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" letter-spacing="1" fill="#7A7A80">WAITLIST OPEN</text>

  <!-- text-only card (no thumbnail, no scene) -->
  <g>
    <rect x="120" y="240" width="440" height="300" rx="16" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>
    <text x="150" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.6" fill="#1C1C1E">Contagious: why users</text>
    <text x="150" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.6" fill="#1C1C1E">share apps</text>
    <text x="150" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#6E6E73">Give your app a shareable win that</text>
    <text x="150" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#6E6E73">flatters users when they post it.</text>
    <rect x="150" y="440" width="380" height="56" rx="12" fill="#7879F1"/>
    <text x="340" y="476" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#FFFFFF">Open the reel</text>
    <text x="150" y="522" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#7A7A80">Saved 3 days ago</text>
  </g>

  <!-- headline -->
  <text x="640" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#1C1C1E">Your saved reels have</text>
  <text x="640" y="366" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#1C1C1E">good ideas in them.</text>
  <text x="640" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#7879F1">None of them made it</text>
  <text x="640" y="478" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#7879F1">into your life.</text>
  <text x="640" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#6E6E73">One actionable card a day. Join the waitlist.</text>
</svg>
