<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <text x="120" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-1" fill="#7879F1">ReelRecall</text>
  <text x="120" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" letter-spacing="1" fill="#7A7A80">WAITLIST OPEN</text>

  <!-- demo card -->
  <g>
    <rect x="120" y="240" width="440" height="310" rx="16" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>
    <text x="150" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.6" fill="#1C1C1E">Contagious: why users</text>
    <text x="150" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.6" fill="#1C1C1E">share apps</text>
    <text x="150" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#6E6E73">Give your app a shareable win that</text>
    <text x="150" y="404" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#6E6E73">flatters users when they post it.</text>
    <!-- thumbnail with fade -->
    <rect x="150" y="428" width="380" height="80" rx="8" fill="#D8DAFB"/>
    <circle cx="190" cy="462" r="18" fill="#7879F1"/>
    <path d="M150 508 Q340 420 530 508 L530 508 L150 508 Z" fill="#C4C6F0"/>
    <rect x="150" y="470" width="380" height="38" fill="url(#fade)"/>
    <defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.95"/></linearGradient></defs>
  </g>

  <!-- headline -->
  <text x="640" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#1C1C1E">Your saved reels have</text>
  <text x="640" y="366" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#1C1C1E">good ideas in them.</text>
  <text x="640" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#7879F1">None of them made it</text>
  <text x="640" y="478" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#7879F1">into your life.</text>
  <text x="640" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#6E6E73">One actionable card a day. Join the waitlist.</text>
</svg>
